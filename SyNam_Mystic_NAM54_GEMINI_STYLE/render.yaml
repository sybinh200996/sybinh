services:
  - type: web
    name: synam-mystic-phoenix
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: GEMINI_IMAGE_MODELS
        value: gemini-3.1-flash-image,gemini-3-pro-image,gemini-2.5-flash-image,gemini-2.5-flash-image-preview,gemini-2.0-flash-preview-image-generation
